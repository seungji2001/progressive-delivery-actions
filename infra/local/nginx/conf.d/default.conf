# Docker 내장 DNS. 컨테이너를 재생성해 IP 가 바뀌어도 reload 없이 따라간다 (server ... resolve)
resolver 127.0.0.11 valid=2s ipv6=off;

# 가중치 upstream (app_weighted) — scripts/local/set-weights.sh 가 관리
include /etc/nginx/upstreams/*.conf;

# 색 지정 upstream — 스모크 테스트용 (ALB 리스너 규칙 X-Target-Color 와 동일한 규격)
upstream app_blue {
    zone app_blue 64k;
    server blue:8080 resolve;
    keepalive 16;
}

upstream app_green {
    zone app_green 64k;
    server green:8080 resolve;
    keepalive 16;
}

map $http_x_target_color $backend {
    blue    app_blue;
    green   app_green;
    default app_weighted;
}

# CloudWatch ALB 지표(HTTPCode_Target_5XX_Count, TargetResponseTime)에 대응하는 원천 로그
log_format pda_json escape=json
    '{"ts":$msec,"status":$status,"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr","upstream_time":"$upstream_response_time",'
    '"app_version":"$upstream_http_x_app_version","target_color":"$http_x_target_color",'
    '"method":"$request_method","uri":"$uri"}';

server {
    listen 80;

    access_log /var/log/pda/access.json pda_json;

    location /monitor/ {
        alias /usr/share/nginx/monitor/;
        access_log off;
    }

    location / {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # ALB 는 실패한 요청을 다른 대상으로 재시도하지 않는다. 같은 동작을 위해 재시도를 끈다.
        # (http_500 을 넣으면 주입한 장애가 재시도로 가려져 카나리 판정이 무력화된다)
        proxy_next_upstream off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }
}
